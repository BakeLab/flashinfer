name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: pre-commit-${{ github.event_name }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && (github.event.pull_request.number || github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4.2.2
    - uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'
    - name: Validate CUDA configuration
      run: python3 ci/validate_cuda_versions.py
    - name: Test compile cache lifecycle (CPU only)
      run: python3 -m unittest discover -s ci/tests -p 'test_compile_cache.py' -v
    - uses: pre-commit/action@v3.0.1
